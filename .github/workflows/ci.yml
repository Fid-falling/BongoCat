name: BongoCat CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bongo-cat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publishing-policy:
    name: security / publishing-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate publishing guards
        shell: pwsh
        run: ./.github/scripts/check-publish-guards.ps1 -SelfTest

  quality:
    name: quality / syntax-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install quality and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build cppcheck \
            libgl1-mesa-dev libx11-dev libxi-dev libxfixes-dev

      - name: Reject legacy product-name references
        run: |
          legacy='l2d''cat'
          if grep -RIni --exclude-dir=.git --exclude-dir=build \
              --exclude='*.png' --exclude='*.flac' "$legacy" .; then
            echo "Legacy product-name reference found"
            exit 1
          fi

      - name: Check source file size policy
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P cmake/CheckLines.cmake

      - name: Run Cppcheck
        shell: bash
        run: |
          mapfile -d '' c_files < <(find src -type f -name '*.c' -print0)
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --std=c11 -Iinclude -Isrc/runtime \
            -Isrc/runtime/lifecycle -Isrc/runtime/model \
            -Isrc/runtime/model/import -Isrc/runtime/model/import/mver \
            -Isrc/runtime/model/import/nearby -Isrc/runtime/shell \
            -Isrc/ui/backend -Isrc/ui/preferences -Isrc/ui/rendering \
            -Isrc/ui/theme -Isrc/platform/windows "${c_files[@]}"
          mapfile -d '' cpp_files < <(find src -type f -name '*.cpp' -print0)
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --suppress=passedByValueCallback --std=c++17 \
            -Iinclude -Isrc/runtime -Isrc/runtime/model/import \
            -Isrc/ui/backend -Isrc/ui/preferences -Isrc/ui/rendering \
            -Isrc/ui/theme "${cpp_files[@]}"

      - name: Configure warning-clean Linux build
        run: |
          cmake -S . -B build-quality -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Register GCC diagnostics
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/gcc-problem-matcher.json"

      - name: Build
        run: bash .github/scripts/build-unix.sh cmake --build build-quality --parallel 2

      - name: Run native tests
        run: ctest --test-dir build-quality --output-on-failure

  build:
    name: build / ${{ matrix.platform }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgl1-mesa-dev libx11-dev libxi-dev \
            libxfixes-dev

      - name: Configure Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Configure Unix release
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Register GCC diagnostics
        if: runner.os == 'Linux'
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/gcc-problem-matcher.json"

      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & ./.github/scripts/build-windows.ps1
          cmake --build build --config Release --parallel 2

      - name: Build Windows validation tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & ./.github/scripts/build-windows.ps1
          cmake --build build --config Release
          --target bongo_cat_validation_tools --parallel 2

      - name: Build Unix release
        if: runner.os != 'Windows'
        run: bash .github/scripts/build-unix.sh cmake --build build --parallel 2

      - name: Test Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & ./.github/scripts/test-windows.ps1
          ctest --test-dir build -C Release --output-on-failure

      - name: Test Unix release
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

  store-package:
    name: package / windows-production
    if: >-
      github.repository == 'vladelaina/BongoCat' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: [publishing-policy, quality]
    runs-on: windows-2022
    env:
      CUBISM_SDK_ARCHIVE_URL: ${{ secrets.CUBISM_SDK_ARCHIVE_URL }}
      CUBISM_SDK_ARCHIVE_SHA256: ${{ secrets.CUBISM_SDK_ARCHIVE_SHA256 }}
      CUBISM_GLEW_ARCHIVE_URL: ${{ secrets.CUBISM_GLEW_ARCHIVE_URL }}
      CUBISM_GLEW_ARCHIVE_SHA256: ${{ secrets.CUBISM_GLEW_ARCHIVE_SHA256 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Restore licensed Cubism SDK
        shell: pwsh
        run: ./.github/scripts/restore-cubism-sdk.ps1

      - name: Configure Store release
        shell: pwsh
        run: |
          cmake -S . -B build-store -G "Visual Studio 17 2022" `
            -A x64 -T v143 `
            -DBONGO_CAT_REQUIRE_CUBISM=ON `
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Build Store release
        shell: pwsh
        run: >-
          & ./.github/scripts/build-windows.ps1
          cmake --build build-store --config Release --parallel 2

      - name: Run Store release tests
        shell: pwsh
        run: >-
          & ./.github/scripts/test-windows.ps1
          ctest --test-dir build-store -C Release --output-on-failure

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $header = Get-Content build-store/generated/bongo_cat/version.h -Raw
          if ($header -notmatch '#define\s+BONGO_CAT_VERSION\s+"([^"]+)"') {
            throw 'Unable to read BongoCat version from generated header'
          }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress --yes
          }
          $nsisCommand = Get-Command makensis.exe -ErrorAction SilentlyContinue
          $nsisRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS'),
            (Join-Path $env:ProgramFiles 'NSIS')
          )
          if ($nsisCommand) { $nsisRoots += Split-Path $nsisCommand.Source }
          $nsisRoot = $nsisRoots | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ 'makensis.exe')
          } | Select-Object -First 1
          if (-not $nsisRoot) {
            throw 'NSIS was not installed (makensis.exe was not found)'
          }
          $nsisRoot | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Package Windows desktop release
        id: desktop-package
        shell: pwsh
        run: |
          $name = (Get-Content build-store/bongo-cat-package-name.txt -Raw).Trim()
          $expected = "BongoCat-${{ steps.version.outputs.version }}-windows-x64"
          if ($name -ne $expected) {
            throw "Cubism desktop package is not production-ready: $name"
          }

          cmake --build build-store --config Release --target package
          cmake --build build-store --config Release --target package-installer
          $files = @(
            "build-store/dist/$name.zip",
            "build-store/dist/$name.zip.sha256",
            "build-store/dist/$name-setup.exe",
            "build-store/dist/$name-setup.exe.sha256"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Production desktop file is missing: $file"
            }
          }
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Microsoft Store MSIX
        shell: pwsh
        run: |
          ./packaging/microsoft-store/build-store-package.ps1 `
            -ExecutablePath "./build-store/Release/BongoCat.exe" `
            -Version "${{ steps.version.outputs.version }}" `
            -OutputDirectory "./store-output"
          $msix = Get-Item "store-output/bongocat_${{ steps.version.outputs.version }}_x64.msix"
          Write-Host ("Microsoft Store MSIX size: {0} KB" -f [math]::Round($msix.Length / 1KB, 2))

      - name: Validate Microsoft Store MSIX
        shell: pwsh
        run: |
          ./packaging/microsoft-store/validate-store-package.ps1 `
            -PackagePath "./store-output/bongocat_${{ steps.version.outputs.version }}_x64.msix" `
            -ExpectedAppVersion "${{ steps.version.outputs.version }}"

      - name: Upload Microsoft Store MSIX
        uses: actions/upload-artifact@v7
        with:
          name: bongocat-store-msix-${{ steps.version.outputs.version }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: store-output/bongocat_${{ steps.version.outputs.version }}_x64.msix
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          archive: false

      - name: Upload Windows desktop release
        uses: actions/upload-artifact@v7
        with:
          name: production-${{ steps.desktop-package.outputs.name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build-store/dist/${{ steps.desktop-package.outputs.name }}.zip
            build-store/dist/${{ steps.desktop-package.outputs.name }}.zip.sha256
            build-store/dist/${{ steps.desktop-package.outputs.name }}-setup.exe
            build-store/dist/${{ steps.desktop-package.outputs.name }}-setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
